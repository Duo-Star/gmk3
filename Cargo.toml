[package]
name = "gmk3"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.37"
egui = "0.37"
egui-wgpu = "0.37"
wgpu = "30"
bytemuck = { version = "1.25", features = ["derive"] }


# 仅在编译到 Web 端时引入以下依赖
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Window", "Element", "HtmlCanvasElement"] }