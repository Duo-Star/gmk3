name: Build Android APK

# 每次推送到 master：编译发布版 APK 并发布为滚动 latest Release
on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Rust 工具链（含 Android 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cargo 依赖缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            # cargo install 的安装记录：没有它的话，缓存的二进制会被当成"已存在"而报错
            ~/.cargo/.crates2.json
          key: cargo-deps-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-deps-

      - name: Rust 构建产物缓存（Android 目标）
        uses: actions/cache@v4
        with:
          path: |
            target/aarch64-linux-android
            target/x86_64-linux-android
          key: cargo-target-android-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-target-android-

      - name: Android SDK 组件（NDK / platform / build-tools）
        run: |
          # runner 镜像自带 SDK（在 /usr/local/lib/android/sdk），
          # 但环境变量不一定注入，这里自己定位并持久化
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "找不到 sdkmanager（SDK_ROOT=$SDK_ROOT）"; ls -la "$SDK_ROOT" 2>/dev/null || true; exit 1
          fi
          echo "SDK_ROOT=$SDK_ROOT"
          echo "sdkmanager=$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          yes | "$SDKMANAGER" --licenses > /dev/null || true
          yes | "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" || true
          # 优先用与本地一致的 NDK r30；仓库里没有就取最新
          if "$SDKMANAGER" --list 2>/dev/null | grep -q "ndk;30.0.16248370"; then
            NDK_PKG="ndk;30.0.16248370"
          else
            NDK_PKG=$("$SDKMANAGER" --list 2>/dev/null | grep -oE "ndk;[0-9.]+" | sort -uV | tail -1)
          fi
          if [ -z "$NDK_PKG" ]; then echo "未找到可用的 NDK 包"; exit 1; fi
          echo "安装 NDK: $NDK_PKG"
          yes | "$SDKMANAGER" --install "$NDK_PKG"
          NDK_VER="${NDK_PKG#ndk;}"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/$NDK_VER" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/$NDK_VER" >> "$GITHUB_ENV"

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: 安装 cargo-ndk
        run: |
          # 缓存命中时二进制已在 ~/.cargo/bin，直接跳过（不依赖 cargo 的安装记录）
          if command -v cargo-ndk >/dev/null 2>&1; then
            echo "cargo-ndk 已存在（缓存命中），跳过安装"
          else
            cargo install cargo-ndk --locked
          fi

      - name: 编译 Rust → libgmk3.so（dist 发布配置）
        run: |
          [ -n "$ANDROID_NDK_HOME" ] || export ANDROID_NDK_HOME="${ANDROID_NDK_ROOT:-}"
          [ -n "$ANDROID_NDK_HOME" ] || export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/$(ls "$ANDROID_SDK_ROOT/ndk" | sort -V | tail -1)"
          echo "NDK: $ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a -t x86_64 -P 24 \
            -o android/app/src/main/jniLibs \
            build --profile dist --lib

      - name: 打包 APK（release，debug 签名，按 ABI 拆三个）
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PenableAbiSplits --no-daemon

      - name: 校验 APK 签名
        run: |
          A="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          for f in app-arm64-v8a-release.apk app-x86_64-release.apk app-universal-release.apk; do
            echo "== $f"
            "$A" verify --print-certs "android/app/build/outputs/apk/release/$f"
          done

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: gmk3-android-apks
          path: |
            android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
            android/app/build/outputs/apk/release/app-x86_64-release.apk
            android/app/build/outputs/apk/release/app-universal-release.apk

      - name: 发布滚动 latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          R=android/app/build/outputs/apk/release
          cp "$R/app-arm64-v8a-release.apk" gmk3-android-arm64-v8a.apk
          cp "$R/app-x86_64-release.apk" gmk3-android-x86_64.apk
          cp "$R/app-universal-release.apk" gmk3-android-universal.apk
          gh release delete latest --yes --cleanup-tag || true
          NOTES="果谷树下，阳光微甜
          很高兴发布 gmk3 的最新更新！
          
          也可以 使用 gmk3 在线版：[gmk3 online](https://gmk3.mduo.cloud/) 或在 [mDuo](https://www.mduo.cloud/) 找到我 😊

          Android apk 安装包：

          - gmk3-android-arm64-v8a.apk  ^^~  如果你不知道选哪个，你就选这个就对了
          - gmk3-android-x86_64.apk
          - gmk3-android-universal.apk

          提交 sha: ${GITHUB_SHA}"
          gh release create latest \
            gmk3-android-arm64-v8a.apk \
            gmk3-android-x86_64.apk \
            gmk3-android-universal.apk \
            --title "gmk3 for Android" \
            --notes "$NOTES" \
            --latest
